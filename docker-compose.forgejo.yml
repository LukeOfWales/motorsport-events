# Local Forgejo + Actions runner, for developing CI workflows offline.
#
# Usage (see docs/forgejo.md for the full walkthrough):
#   1. docker compose -f docker-compose.forgejo.yml up -d forgejo
#   2. Open http://localhost:3000 and complete first-run setup + create a user.
#   3. Create a repo, push this project to it.
#   4. Get a runner registration token:
#        Site Admin -> Actions -> Runners -> Create new runner   (or per-repo)
#   5. Register the runner (one-off):
#        docker compose -f docker-compose.forgejo.yml run --rm runner-register <TOKEN>
#   6. docker compose -f docker-compose.forgejo.yml up -d runner
#
# Data persists in the ./.forgejo-data volume (git-ignored).

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    environment:
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__actions__ENABLED: "true"
    ports:
      - "3000:3000"      # web UI
      - "2222:22"        # git over ssh (host 2222 -> container 22)
    volumes:
      - ./.forgejo-data:/data
    restart: unless-stopped

  # One-off registration. The token is passed via the RUNNER_TOKEN env var:
  #   make forgejo-register TOKEN=<token>
  runner-register:
    image: code.forgejo.org/forgejo/runner:6
    profiles: ["register"]
    depends_on: [forgejo]
    environment:
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
    entrypoint: ["sh", "-c"]
    command:
      - >
        forgejo-runner register --no-interactive
        --instance http://forgejo:3000
        --name local-runner
        --labels "ubuntu-latest:docker://catthehacker/ubuntu:act-latest,docker:docker://catthehacker/ubuntu:act-latest"
        --token "$${RUNNER_TOKEN}"
    volumes:
      - ./.forgejo-runner:/data
    networks: [default]

  runner:
    image: code.forgejo.org/forgejo/runner:6
    container_name: forgejo-runner
    depends_on: [forgejo]
    # Run as root so the container can access the host Docker socket (used to
    # spawn job containers). Without this the daemon gets 'permission denied'
    # pinging /var/run/docker.sock.
    user: root
    entrypoint: ["forgejo-runner", "daemon", "--config", "/config.yaml"]
    # The runner needs the host Docker socket to spawn job containers.
    volumes:
      - ./.forgejo-runner:/data
      - ./forgejo-runner.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  default:
    name: forgejo
