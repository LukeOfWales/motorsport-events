<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motorsport Events</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Motorsport Events</h1>
    <p class="subtitle" id="home-label">near CF10 1EP</p>
  </header>

  <section class="summary" id="summary" hidden>
    <div class="summary-card" id="summary-total"></div>
    <div class="summary-card" id="summary-nearest"></div>
  </section>

  <section class="controls">
    <div class="control">
      <label for="postcode">Your postcode</label>
      <form id="postcode-form" class="postcode-row">
        <input id="postcode" type="text" inputmode="text" autocomplete="postal-code"
               placeholder="e.g. CF10 1EP" aria-label="Your postcode" />
        <button type="submit">Set</button>
      </form>
      <span id="postcode-status" class="postcode-status"></span>
    </div>
    <div class="control">
      <label for="view">View</label>
      <select id="view">
        <option value="list">List</option>
        <option value="month">Month</option>
        <option value="map">Map</option>
      </select>
    </div>
    <div class="control">
      <label for="radius">Within (km)</label>
      <select id="radius">
        <option value="">Any distance</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="150" selected>150</option>
        <option value="300">300</option>
      </select>
    </div>
    <div class="control">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="title, venue, organiser"
             aria-label="Search events" />
    </div>
    <div class="control control-toggles">
      <label>&nbsp;</label>
      <div class="toggles">
        <button id="toggle-weekend" class="chip" type="button">Weekends only</button>
        <button id="toggle-saved" class="chip" type="button">★ Saved</button>
        <button id="toggle-smart" class="chip" type="button" title="Use a wider radius for rallies, tighter for local trials">Smart radius</button>
      </div>
    </div>
    <div class="control control-disciplines">
      <label>Disciplines</label>
      <div id="disciplines" class="chips"></div>
    </div>
    <div class="control control-disciplines">
      <label>Sources</label>
      <div id="sources" class="chips"></div>
    </div>
  </section>

  <main id="content" aria-live="polite"></main>

  <footer>
    <p>
      <a id="subscribe-link" href="#" target="_blank" rel="noopener">Subscribe to calendar (.ics)</a>
      · <a id="health-link" href="#">source status</a>
      · data refreshed via <code>python -m app.ingest</code>
    </p>
  </footer>

  <!-- Event detail modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
